[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
/(
  | \.venv
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import ordering
    "B",    # flake8-bugbear — likely bugs
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length — black owns this
    "RUF012",  # mutable class attrs need ClassVar; noisy against Django Meta
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # star-imports from base are intentional

[tool.ruff.lint.isort]
known-first-party = ["accounts", "academics", "registration", "api", "config"]
